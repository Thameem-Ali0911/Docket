spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docket}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me}
gemini:
  api-key: ${GEMINI_API_KEY:}
server:
  port: 8080

storage.upload-dir: ${STORAGE_UPLOAD_DIR:/app/uploads}