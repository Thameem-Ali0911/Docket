spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docket}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
flyway:
  enabled: true
  locations: classpath:db/migration
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me}
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
server:
  port: 8080
